<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../">
  <title>Prop quality review</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 24px; font: 14px system-ui; color: #2d261e; background: #f3e8d9; }
    h1 { margin-bottom: 8px; }
    p { line-height: 1.5; }
    nav { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 14px 0; }
    select { margin-left: 8px; padding: 8px; }
    main { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    main[data-zoom="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    article { background: #fff8eb; border: 1px solid #d4bda4; border-radius: 14px; padding: 16px; }
    h2 { font-size: 14px; margin: 12px 0 6px; }
    small { color: #715a47; }
    .stage { height: 240px; display: grid; place-items: center; background: #faf5ec; border-radius: 8px; overflow: auto; }
    .stage svg { display: block; width: 100%; height: 100%; }
    .tray { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    .tray svg { width: 56px; height: 56px; flex-shrink: 0; }
    #status { padding: 10px 14px; background: #fff8eb; border-radius: 8px; }
    #status[data-result="fail"] { color: #9a342c; }
    @media (max-width: 900px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); } main[data-zoom="2"] { grid-template-columns: 1fr; } }
    @media (max-width: 500px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Prop quality review</h1>
  <p>Compare silhouettes, material details and outline weight at scene and tray sizes. The plant is the reference for the Family &amp; Home upgrades.</p>
  <nav>
    <label>Collection<select id="pack"><option value="pack_family_home">Family &amp; Home · 40 upgraded</option><option value="core">Core · 22 reference props</option><option value="all">All 62 props</option><option value="comparison">Plant and upgraded bouquet</option></select></label>
    <label>Scale<select id="scale"><option value="1">100%</option><option value="2">200%</option></select></label>
    <label><input id="flip" type="checkbox"> Flip horizontally</label>
  </nav>
  <p id="status" role="status">Loading and checking all 62 props…</p>
  <main></main>
  <script type="module" src="review/prop-quality.js"></script>
</body>
</html>
