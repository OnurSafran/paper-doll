<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" data-asset-id="bg_library">
  <g id="background" stroke="#2d261e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cozy Library Room Wall -->
    <rect width="800" height="350" fill="#f4ebd9" stroke="none"/>
    
    <!-- Grand Arched Window in Center -->
    <g transform="translate(300, 20)">
      <!-- Outer Frame -->
      <path d="M0 100 A100 100 0 0 1 200 100 L200 280 L0 280 Z" fill="#203a43" stroke="#8b5e34" stroke-width="8"/>
      <!-- Window Night Sky with Stars -->
      <circle cx="150" cy="80" r="15" fill="#ffd166" stroke="none"/>
      <polygon points="50,60 52,65 57,65 53,68 54,73 50,70 46,73 47,68 43,65 48,65" fill="#ffffff" stroke="none"/>
      <polygon points="90,120 92,125 97,125 93,128 94,133 90,130 86,133 87,128 83,125 88,125" fill="#ffffff" stroke="none"/>
      <!-- Window Panes Grids -->
      <path d="M100 0 L100 280 M0 100 L200 100 M0 190 L200 190" stroke="#8b5e34" stroke-width="5"/>
      <!-- Drapery / Curtains on Window Sides -->
      <path d="M-15 0 Q20 120 5 280 L-25 280 L-25 0 Z" fill="#b56576" stroke="#2d261e" stroke-width="2.5"/>
      <path d="M215 0 Q180 120 195 280 L225 280 L225 0 Z" fill="#b56576" stroke="#2d261e" stroke-width="2.5"/>
    </g>

    <!-- Bookshelf Left (Tall) -->
    <g transform="translate(30, 20)">
      <rect width="220" height="320" rx="4" fill="#6f4e37" stroke="#2d261e" stroke-width="4"/>
      <!-- Shelves -->
      <rect x="10" y="20" width="200" height="65" fill="#583e2e" stroke="none"/>
      <rect x="10" y="95" width="200" height="65" fill="#583e2e" stroke="none"/>
      <rect x="10" y="170" width="200" height="65" fill="#583e2e" stroke="none"/>
      <rect x="10" y="245" width="200" height="65" fill="#583e2e" stroke="none"/>
      
      <!-- Books on Shelf 1 -->
      <rect x="18" y="32" width="18" height="53" fill="#e76f51"/>
      <rect x="36" y="25" width="22" height="60" fill="#2a9d8f"/>
      <rect x="58" y="38" width="16" height="47" fill="#e9c46a"/>
      <rect x="74" y="28" width="26" height="57" fill="#457b9d"/>
      <rect x="100" y="35" width="18" height="50" fill="#a78bc4"/>
      <!-- Leaning Book -->
      <polygon points="122,85 140,40 158,45 138,85" fill="#f4a261"/>

      <!-- Books on Shelf 2 -->
      <rect x="18" y="105" width="28" height="55" fill="#457b9d"/>
      <rect x="46" y="115" width="18" height="45" fill="#e76f51"/>
      <rect x="64" y="100" width="24" height="60" fill="#52b788"/>
      <rect x="140" y="110" width="22" height="50" fill="#e9c46a"/>
      <rect x="162" y="102" width="20" height="58" fill="#b56576"/>
      <rect x="182" y="112" width="18" height="48" fill="#264653"/>

      <!-- Books on Shelf 3 & Potted Plant -->
      <rect x="18" y="180" width="22" height="55" fill="#e9c46a"/>
      <rect x="40" y="175" width="26" height="60" fill="#2a9d8f"/>
      <g transform="translate(150, 185)">
        <polygon points="10,35 15,50 35,50 40,35" fill="#e07a5f"/>
        <circle cx="20" cy="25" r="10" fill="#81b29a"/>
        <circle cx="30" cy="20" r="9" fill="#81b29a"/>
      </g>
    </g>

    <!-- Bookshelf Right (Tall) -->
    <g transform="translate(550, 20)">
      <rect width="220" height="320" rx="4" fill="#6f4e37" stroke="#2d261e" stroke-width="4"/>
      <!-- Shelves -->
      <rect x="10" y="20" width="200" height="65" fill="#583e2e" stroke="none"/>
      <rect x="10" y="95" width="200" height="65" fill="#583e2e" stroke="none"/>
      <rect x="10" y="170" width="200" height="65" fill="#583e2e" stroke="none"/>
      <rect x="10" y="245" width="200" height="65" fill="#583e2e" stroke="none"/>

      <!-- Books on Right Shelves -->
      <rect x="18" y="30" width="24" height="55" fill="#a78bc4"/>
      <rect x="42" y="38" width="18" height="47" fill="#52b788"/>
      <rect x="60" y="25" width="26" height="60" fill="#e76f51"/>
      <rect x="86" y="32" width="22" height="53" fill="#e9c46a"/>
      <rect x="150" y="35" width="25" height="50" fill="#457b9d"/>
      <rect x="175" y="28" width="20" height="57" fill="#b56576"/>

      <rect x="18" y="105" width="20" height="55" fill="#2a9d8f"/>
      <rect x="38" y="112" width="24" height="48" fill="#f4a261"/>
      <rect x="62" y="102" width="22" height="58" fill="#264653"/>
      <rect x="120" y="110" width="30" height="50" fill="#b56576"/>
      <rect x="150" y="100" width="25" height="60" fill="#e9c46a"/>
    </g>

    <!-- Baseboard -->
    <rect y="338" width="800" height="16" fill="#583e2e" stroke="#2d261e" stroke-width="2"/>

    <!-- Parquet Wooden Flooring -->
    <rect y="354" width="800" height="146" fill="#b58a63" stroke="none"/>
    <g stroke="#8b5e34" stroke-width="2">
      <line x1="0" y1="400" x2="800" y2="400"/>
      <line x1="0" y1="450" x2="800" y2="450"/>
      <line x1="120" y1="354" x2="120" y2="400"/><line x1="360" y1="354" x2="360" y2="400"/><line x1="600" y1="354" x2="600" y2="400"/>
      <line x1="240" y1="400" x2="240" y2="450"/><line x1="480" y1="400" x2="480" y2="450"/><line x1="720" y1="400" x2="720" y2="450"/>
      <line x1="160" y1="450" x2="160" y2="500"/><line x1="400" y1="450" x2="400" y2="500"/><line x1="640" y1="450" x2="640" y2="500"/>
    </g>
  </g>
</svg>
