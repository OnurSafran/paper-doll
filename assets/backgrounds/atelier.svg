<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" data-asset-id="bg_atelier">
  <g id="background" stroke="#2d261e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Brick Studio Wall -->
    <rect width="800" height="360" fill="#f4edea" stroke="none"/>
    <!-- Exposed Brick Lines -->
    <g stroke="#e2d4cf" stroke-width="2" stroke-dasharray="30 8">
      <line x1="0" y1="40" x2="800" y2="40"/><line x1="15" y1="70" x2="800" y2="70"/>
      <line x1="0" y1="100" x2="800" y2="100"/><line x1="15" y1="130" x2="800" y2="130"/>
      <line x1="0" y1="160" x2="800" y2="160"/><line x1="15" y1="190" x2="800" y2="190"/>
      <line x1="0" y1="220" x2="800" y2="220"/>
    </g>
    <!-- Atelier Easel in Background -->
    <g transform="translate(100, 90)" stroke="#2d261e" stroke-width="2.5" stroke-linejoin="round">
      <line x1="60" y1="20" x2="10" y2="270" stroke="#8b5e34" stroke-width="5"/>
      <line x1="60" y1="20" x2="110" y2="270" stroke="#8b5e34" stroke-width="5"/>
      <line x1="60" y1="20" x2="60" y2="270" stroke="#684524" stroke-width="4"/>
      <!-- Canvas Board -->
      <rect x="25" y="70" width="70" height="90" rx="4" fill="#ffffff"/>
      <circle cx="60" cy="110" r="18" fill="#e76f51" stroke="none"/>
      <circle cx="50" cy="120" r="12" fill="#e9c46a" stroke="none"/>
    </g>
    <!-- Studio Concrete / Wood Floor -->
    <rect y="360" width="800" height="140" fill="#ded5c6" stroke="#2d261e" stroke-width="2.5"/>
    <line x1="0" y1="420" x2="800" y2="420" stroke="#c9bea9" stroke-width="2"/>
  </g>
</svg>
