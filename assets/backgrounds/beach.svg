<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" data-asset-id="bg_beach">
  <g id="background" stroke="#2d261e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sky -->
    <rect width="800" height="280" fill="#d8effa" stroke="none"/>
    
    <!-- Warm Sun -->
    <circle cx="680" cy="90" r="45" fill="#ffd166" stroke="#2d261e" stroke-width="2.5"/>
    <circle cx="680" cy="90" r="36" fill="#ffe082" stroke="none"/>
    
    <!-- Soft Paper Clouds -->
    <g fill="#ffffff">
      <path d="M120 70 Q140 50 170 60 Q200 45 225 65 Q245 60 255 75 Q260 90 240 100 L130 100 Q110 95 120 70 Z"/>
      <path d="M420 100 Q435 85 455 90 Q475 80 495 95 Q510 90 520 105 L430 115 Z" opacity="0.9"/>
    </g>
    
    <!-- Distant Sailboat -->
    <g transform="translate(480, 195)">
      <polygon points="20,0 20,40 5,40" fill="#ffffff"/>
      <polygon points="23,8 23,40 40,40" fill="#ef476f"/>
      <line x1="21" y1="0" x2="21" y2="45" stroke-width="2"/>
      <path d="M0 45 Q20 52 45 45 L40 54 Q20 58 5 54 Z" fill="#73513d"/>
    </g>
    
    <!-- Deep Ocean & Waves -->
    <rect y="240" width="800" height="70" fill="#4ea8de" stroke="none"/>
    <path d="M0 260 Q100 250 200 260 T400 260 T600 260 T800 260 L800 290 L0 290 Z" fill="#56cfe1" stroke="none"/>
    <path d="M0 280 Q100 270 200 280 T400 280 T600 280 T800 280 L800 320 L0 320 Z" fill="#72efdd" stroke="none"/>
    <path d="M0 260 Q100 250 200 260 T400 260 T600 260 T800 260" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M0 280 Q100 270 200 280 T400 280 T600 280 T800 280" fill="none" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Foamy Shoreline -->
    <path d="M0 310 Q150 295 300 310 T600 305 T800 315 L800 335 L0 335 Z" fill="#e0fbfc" stroke="none"/>
    <path d="M0 310 Q150 295 300 310 T600 305 T800 315" fill="none" stroke="#ffffff" stroke-width="4"/>

    <!-- Sandy Beach Shore -->
    <path d="M0 330 Q200 315 400 325 T800 320 L800 500 L0 500 Z" fill="#fde2b8"/>
    <path d="M0 380 Q250 365 500 380 T800 375" fill="none" stroke="#ebd0a0" stroke-width="3"/>
    <path d="M0 430 Q200 420 450 435 T800 425" fill="none" stroke="#ebd0a0" stroke-width="3"/>

    <!-- Starfish & Shells on Sand -->
    <polygon points="110,410 113,418 122,418 115,423 118,431 110,426 102,431 105,423 98,418 107,418" fill="#ef476f"/>
    <ellipse cx="690" cy="420" rx="12" ry="9" fill="#f3c68f"/>
    <line x1="685" y1="416" x2="695" y2="424" stroke="#73513d" stroke-width="1.5"/>

    <!-- Palm Fronds (Top Left Corner Framing) -->
    <g transform="translate(-40, -30)">
      <path d="M0 0 Q80 40 180 120" fill="none" stroke="#73513d" stroke-width="8"/>
      <path d="M60 20 Q120 0 190 20 Q120 40 60 20 Z" fill="#588157"/>
      <path d="M90 45 Q160 30 220 70 Q150 75 90 45 Z" fill="#6b9080"/>
      <path d="M120 75 Q190 70 240 125 Q170 120 120 75 Z" fill="#588157"/>
      <path d="M140 100 Q200 120 220 180 Q170 160 140 100 Z" fill="#386641"/>
    </g>
  </g>
</svg>
