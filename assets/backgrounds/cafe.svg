<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" data-asset-id="bg_cafe">
  <g id="background" stroke="#2d261e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Warm Cafe Wall -->
    <rect width="800" height="360" fill="#fcf6ec" stroke="none"/>
    
    <!-- Exposed Pastel Brick Texture -->
    <g fill="#faede1" stroke="#ebd9ca" stroke-width="1.5">
      <rect x="40" y="40" width="70" height="22" rx="3"/>
      <rect x="125" y="40" width="70" height="22" rx="3"/>
      <rect x="80" y="70" width="70" height="22" rx="3"/>
      <rect x="650" y="50" width="75" height="22" rx="3"/>
      <rect x="690" y="80" width="65" height="22" rx="3"/>
      <rect x="610" y="80" width="70" height="22" rx="3"/>
    </g>

    <!-- Striped Bistro Awning -->
    <g transform="translate(180, 0)">
      <polygon points="0,0 20,70 60,70 40,0" fill="#ef7f72"/>
      <polygon points="40,0 60,70 100,70 80,0" fill="#fffdf7"/>
      <polygon points="80,0 100,70 140,70 120,0" fill="#ef7f72"/>
      <polygon points="120,0 140,70 180,70 160,0" fill="#fffdf7"/>
      <polygon points="160,0 180,70 220,70 200,0" fill="#ef7f72"/>
      <polygon points="200,0 220,70 260,70 240,0" fill="#fffdf7"/>
      <polygon points="240,0 260,70 300,70 280,0" fill="#ef7f72"/>
      <polygon points="280,0 300,70 340,70 320,0" fill="#fffdf7"/>
      <polygon points="320,0 340,70 380,70 360,0" fill="#ef7f72"/>
      <polygon points="360,0 380,70 420,70 400,0" fill="#fffdf7"/>
      <polygon points="400,0 420,70 460,70 440,0" fill="#ef7f72"/>
      <!-- Scalloped Edge -->
      <path d="M0 70 Q20 85 40 70 Q60 85 80 70 Q100 85 120 70 Q140 85 160 70 Q180 85 200 70 Q220 85 240 70 Q260 85 280 70 Q300 85 320 70 Q340 85 360 70 Q380 85 400 70 Q420 85 440 70" fill="none" stroke="#2d261e" stroke-width="2.5"/>
    </g>

    <!-- Large Cafe Showcase Window -->
    <rect x="220" y="85" width="360" height="235" rx="8" fill="#e2f1f8" stroke="#73513d" stroke-width="6"/>
    <line x1="400" y1="85" x2="400" y2="320" stroke="#73513d" stroke-width="5"/>
    <line x1="220" y1="200" x2="580" y2="200" stroke="#73513d" stroke-width="5"/>
    <!-- Glass Reflections -->
    <path d="M260 105 L360 270" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <path d="M285 105 L385 270" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Chalkboard Menu on Wall -->
    <g transform="translate(60, 110)">
      <rect width="110" height="150" rx="6" fill="#3c342d" stroke="#8b5e34" stroke-width="6"/>
      <text x="55" y="30" font-family="sans-serif" font-size="12" fill="#ffd166" text-anchor="middle" font-weight="bold">CAFE</text>
      <line x1="20" y1="45" x2="90" y2="45" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 2"/>
      <line x1="20" y1="65" x2="75" y2="65" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="20" y1="85" x2="85" y2="85" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="20" y1="105" x2="65" y2="105" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="55" cy="130" r="8" fill="#ef7f72" stroke="none"/>
    </g>

    <!-- Pendant Lamp -->
    <g transform="translate(670, 0)">
      <line x1="25" y1="0" x2="25" y2="110" stroke="#2d261e" stroke-width="3"/>
      <path d="M5 130 C5 110 45 110 45 130 Z" fill="#e9aa3a"/>
      <ellipse cx="25" cy="130" rx="20" ry="6" fill="#ffd166"/>
      <ellipse cx="25" cy="136" rx="6" ry="6" fill="#ffffff"/>
    </g>

    <!-- Wooden Baseboard -->
    <rect y="348" width="800" height="16" fill="#cbb299" stroke="#2d261e" stroke-width="2"/>

    <!-- Checkerboard Cafe Tile Floor -->
    <rect y="364" width="800" height="136" fill="#ede0d4" stroke="none"/>
    <g fill="#c9b8a8">
      <polygon points="0,364 80,364 40,410 0,410"/>
      <polygon points="160,364 240,364 200,410 120,410"/>
      <polygon points="320,364 400,364 360,410 280,410"/>
      <polygon points="480,364 560,364 520,410 440,410"/>
      <polygon points="640,364 720,364 680,410 600,410"/>
      <polygon points="800,364 800,410 760,410"/>

      <polygon points="40,410 120,410 80,460 0,460"/>
      <polygon points="200,410 280,410 240,460 160,460"/>
      <polygon points="360,410 440,410 400,460 320,460"/>
      <polygon points="520,410 600,410 560,460 480,460"/>
      <polygon points="680,410 760,410 720,460 640,460"/>

      <polygon points="0,460 80,460 40,500 0,500"/>
      <polygon points="160,460 240,460 200,500 120,500"/>
      <polygon points="320,460 400,460 360,500 280,500"/>
      <polygon points="480,460 560,460 520,500 440,500"/>
      <polygon points="640,460 720,460 680,500 600,500"/>
      <polygon points="800,460 800,500 760,500"/>
    </g>
    <line x1="0" y1="410" x2="800" y2="410" stroke="#b09d8d" stroke-width="1.5"/>
    <line x1="0" y1="460" x2="800" y2="460" stroke="#b09d8d" stroke-width="1.5"/>
  </g>
</svg>
