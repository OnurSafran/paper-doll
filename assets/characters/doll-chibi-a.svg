<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" data-asset-id="doll_chibi_a">
  <g id="body" class="outline-shape" stroke="#2d261e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Child Neck -->
    <rect class="skin-fill" x="140" y="91" width="20" height="23" rx="4" fill="var(--skin-color, #fcd7b6)"/>
    
    <!-- Torso -->
    <path class="skin-fill" d="M124 112 C118 136 118 163 121 195 C123 211 129 222 134 230 L166 230 C171 222 177 211 179 195 C182 163 182 136 176 112 C164 118 136 118 124 112 Z" fill="var(--skin-color, #fcd7b6)"/>
    
    <!-- Pastel Lavender Undergarments -->
    <path d="M125 125 C135 140 165 140 175 125 L173 155 C165 158 135 158 127 155 Z" fill="#eeddf5" stroke="#2d261e" stroke-width="2"/>
    <path d="M123 200 C140 205 160 205 177 200 L174 225 C160 229 140 229 126 225 Z" fill="#eeddf5" stroke="#2d261e" stroke-width="2"/>
    
    <!-- Legs & Feet -->
    <!-- Left Leg -->
    <path class="skin-fill" d="M131 229 C129 269 127 318 129 369 L144 369 C145 318 148 269 147 229 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Leg -->
    <path class="skin-fill" d="M153 229 C152 269 155 318 156 369 L171 369 C173 318 171 269 169 229 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Left Foot -->
    <path class="skin-fill" d="M127 369 C124 381 119 391 115 395 C121 400 138 400 144 395 L144 369 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Foot -->
    <path class="skin-fill" d="M156 369 L156 395 C162 400 179 400 185 395 C181 391 176 381 172 369 Z" fill="var(--skin-color, #fcd7b6)"/>

    <!-- Arms -->
    <!-- Left Arm -->
    <path class="skin-fill" d="M124 114 C111 138 101 169 97 201 C95 212 101 217 106 213 C111 180 119 150 130 125 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Arm -->
    <path class="skin-fill" d="M176 114 C189 138 199 169 203 201 C205 212 199 217 194 213 C189 180 181 150 170 125 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Left Hand -->
    <circle class="skin-fill" cx="98" cy="213" r="7" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Hand -->
    <circle class="skin-fill" cx="202" cy="213" r="7" fill="var(--skin-color, #fcd7b6)"/>

    <!-- Child knee dimples -->
    <path d="M131 313 Q137 316 143 313 M157 313 Q163 316 169 313" fill="none" stroke="#c98c70" stroke-width="1.3" opacity="0.35"/>

    <!-- Head -->
    <ellipse class="skin-fill" cx="150" cy="62" rx="32" ry="37" fill="var(--skin-color, #fcd7b6)"/>
    
    <!-- Ears -->
    <circle class="skin-fill" cx="117" cy="64" r="5" fill="var(--skin-color, #fcd7b6)"/>
    <circle class="skin-fill" cx="183" cy="64" r="5" fill="var(--skin-color, #fcd7b6)"/>

    <!-- Face Details -->
    <g id="baked-face">
      <!-- Sweet Pink Anime Blush -->
      <ellipse cx="132" cy="68" rx="7" ry="4" fill="#ffb4a2" opacity="0.7" stroke="none"/>
      <ellipse cx="168" cy="68" rx="7" ry="4" fill="#ffb4a2" opacity="0.7" stroke="none"/>

      <!-- Big Sparkling Anime Eyes with Multiple Highlights -->
      <!-- Left Eye -->
      <ellipse cx="135" cy="59" rx="4.5" ry="6" fill="#2d261e" stroke="none"/>
      <circle cx="134" cy="56.5" r="2" fill="#ffffff" stroke="none"/>
      <circle cx="137" cy="61.5" r="1.2" fill="#ffffff" stroke="none"/>
      <path d="M130 52 C134 50 138 50 142 52" fill="none" stroke="#2d261e" stroke-width="2"/>

      <!-- Right Eye -->
      <ellipse cx="165" cy="59" rx="4.5" ry="6" fill="#2d261e" stroke="none"/>
      <circle cx="164" cy="56.5" r="2" fill="#ffffff" stroke="none"/>
      <circle cx="167" cy="61.5" r="1.2" fill="#ffffff" stroke="none"/>
      <path d="M158 52 C162 50 166 50 170 52" fill="none" stroke="#2d261e" stroke-width="2"/>

      <!-- Cute Button Nose & Smile -->
      <circle cx="150" cy="66" r="1" fill="#2d261e" stroke="none"/>
      <path id="doll-mouth-default" d="M146 73 C148 76 152 76 154 73" fill="none" stroke="#2d261e" stroke-width="2" stroke-linecap="round"/>
