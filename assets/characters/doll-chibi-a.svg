    <ellipse cx="132" cy="68" rx="7" ry="4" fill="#ffb4a2" opacity="0.7" stroke="none"/>
    <ellipse cx="168" cy="68" rx="7" ry="4" fill="#ffb4a2" opacity="0.7" stroke="none"/>
    
    <!-- Big Sparkling Anime Eyes with Multiple Highlights -->
    <!-- Left Eye -->
    <ellipse cx="135" cy="59" rx="4.5" ry="6" fill="#2d261e" stroke="none"/>
    <circle cx="134" cy="56.5" r="2" fill="#ffffff" stroke="none"/>
