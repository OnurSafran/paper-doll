<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" data-asset-id="doll_classic_b">
  <g id="pose-root">
  <g id="body" class="outline-shape" stroke="#2d261e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Torso -->
    <g id="torso">
      <!-- Teen Neck -->
      <rect class="skin-fill" x="141" y="90" width="18" height="24" rx="4" fill="var(--skin-color, #fcd7b6)"/>
      
      <!-- Torso -->
      <path class="skin-fill" d="M124 112 C118 136 119 163 122 195 C124 211 130 222 135 230 L165 230 C170 222 176 211 178 195 C181 163 182 136 176 112 C163 118 137 118 124 112 Z" fill="var(--skin-color, #fcd7b6)"/>
      
      <!-- Cute Pastel Undergarments with Star Detail -->
      <path d="M125 125 C135 140 165 140 175 125 L173 155 C165 158 135 158 127 155 Z" fill="#e0fbfc" stroke="#2d261e" stroke-width="2"/>
      <path d="M123 200 C140 205 160 205 177 200 L174 225 C160 229 140 229 126 225 Z" fill="#e0fbfc" stroke="#2d261e" stroke-width="2"/>
    </g>
    
    <!-- Legs & Feet -->
    <!-- Left Leg -->
    <g id="pose-leg-left">
      <path class="skin-fill" d="M132 228 C129 273 127 326 129 381 L144 381 C145 327 148 273 147 228 Z" fill="var(--skin-color, #fcd7b6)"/>
      <path class="skin-fill" d="M127 381 C124 391 119 401 114 405 C121 410 138 410 144 405 L144 381 Z" fill="var(--skin-color, #fcd7b6)"/>
      <path d="M131 326 Q137 329 143 326" fill="none" stroke="#c98c70" stroke-width="1.3" opacity="0.3"/>
    </g>
    <!-- Right Leg -->
    <g id="pose-leg-right">
      <path class="skin-fill" d="M153 228 C152 273 155 327 156 381 L171 381 C173 326 171 273 169 228 Z" fill="var(--skin-color, #fcd7b6)"/>
      <path class="skin-fill" d="M156 381 L156 405 C162 410 179 410 186 405 C182 401 176 391 173 381 Z" fill="var(--skin-color, #fcd7b6)"/>
      <path d="M157 326 Q163 329 169 326" fill="none" stroke="#c98c70" stroke-width="1.3" opacity="0.3"/>
    </g>

    <!-- Arms -->
    <!-- Left Arm -->
    <g id="pose-arm-left">
      <path class="skin-fill" d="M124 114 C111 140 101 171 97 205 C95 215 101 219 106 214 C111 180 119 150 130 125 Z" fill="var(--skin-color, #fcd7b6)"/>
      <circle class="skin-fill" cx="98" cy="215" r="7" fill="var(--skin-color, #fcd7b6)"/>
    </g>
    <!-- Right Arm -->
    <g id="pose-arm-right">
      <path class="skin-fill" d="M176 114 C189 140 199 171 203 205 C205 215 199 219 194 214 C189 180 181 150 170 125 Z" fill="var(--skin-color, #fcd7b6)"/>
      <circle class="skin-fill" cx="202" cy="215" r="7" fill="var(--skin-color, #fcd7b6)"/>
    </g>

    <!-- Rigged Head Channel -->
    <g id="pose-head">
      <!-- Head -->
      <ellipse class="skin-fill" cx="150" cy="62" rx="30" ry="35" fill="var(--skin-color, #fcd7b6)"/>
      
      <!-- Ears -->
      <circle class="skin-fill" cx="119" cy="64" r="5" fill="var(--skin-color, #fcd7b6)"/>
      <circle class="skin-fill" cx="181" cy="64" r="5" fill="var(--skin-color, #fcd7b6)"/>

      <!-- Face Details -->
      <g id="baked-face">
        <!-- Sweet Coral Blush -->
        <ellipse cx="134" cy="69" rx="6.5" ry="4" fill="#f28482" opacity="0.6" stroke="none"/>
        <ellipse cx="166" cy="69" rx="6.5" ry="4" fill="#f28482" opacity="0.6" stroke="none"/>

        <!-- Left Eye: Cheerful Wink -->
        <path d="M130 61 Q136 55 142 61" fill="none" stroke="#2d261e" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M131 54 C134 52 139 52 142 54" fill="none" stroke="#2d261e" stroke-width="1.8"/>

        <!-- Right Eye: Big Sparkle Eye -->
        <ellipse cx="164" cy="60" rx="3.8" ry="5.2" fill="#2d261e" stroke="none"/>
        <circle cx="163" cy="58" r="1.6" fill="#ffffff" stroke="none"/>
        <circle cx="165" cy="62" r="0.8" fill="#ffffff" stroke="none"/>
        <path d="M158 54 C161 52 166 52 169 54" fill="none" stroke="#2d261e" stroke-width="1.8"/>

        <!-- Star Freckle Accent -->
        <circle cx="134" cy="70" r="0.9" fill="#e76f51" stroke="none"/>
        <circle cx="166" cy="70" r="0.9" fill="#e76f51" stroke="none"/>

        <!-- Tiny Nose & Default Smile -->
        <circle cx="150" cy="66" r="1" fill="#2d261e" stroke="none"/>
        <path id="doll-mouth-default" d="M146 73 C148 76 152 76 154 73" fill="none" stroke="#2d261e" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
  </g>
  </g>
</svg>
