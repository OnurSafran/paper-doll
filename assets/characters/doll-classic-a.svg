<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" data-asset-id="doll_classic_a">
  <g id="pose-root">
  <g id="body" class="outline-shape" stroke="#2d261e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Torso -->
    <g id="torso">
      <!-- Teen Neck -->
      <rect class="skin-fill" x="142" y="90" width="16" height="24" rx="4" fill="var(--skin-color, #fcd7b6)"/>
      
      <!-- Torso -->
      <path class="skin-fill" d="M126 112 C120 136 120 163 122 195 C124 211 130 222 135 230 L165 230 C170 222 176 211 178 195 C180 163 180 136 174 112 C163 118 137 118 126 112 Z" fill="var(--skin-color, #fcd7b6)"/>
      
      <!-- Cute Pastel Undergarments -->
      <path d="M125 125 C135 140 165 140 175 125 L173 155 C165 158 135 158 127 155 Z" fill="#ffe5ec" stroke="#2d261e" stroke-width="2"/>
      <path d="M123 200 C140 205 160 205 177 200 L174 225 C160 229 140 229 126 225 Z" fill="#ffe5ec" stroke="#2d261e" stroke-width="2"/>
    </g>
    
    <!-- Legs & Feet -->
    <!-- Left Leg -->
    <g id="pose-leg-left">
      <path class="skin-fill" d="M133 228 C130 273 128 326 130 381 L144 381 C145 327 148 273 147 228 Z" fill="var(--skin-color, #fcd7b6)"/>
      <path class="skin-fill" d="M128 381 C125 391 120 401 115 405 C122 410 138 410 144 405 L144 381 Z" fill="var(--skin-color, #fcd7b6)"/>
      <path d="M132 326 Q138 329 143 326" fill="none" stroke="#c98c70" stroke-width="1.3" opacity="0.3"/>
    </g>
    <!-- Right Leg -->
    <g id="pose-leg-right">
      <path class="skin-fill" d="M153 228 C152 273 155 327 156 381 L170 381 C172 326 170 273 168 228 Z" fill="var(--skin-color, #fcd7b6)"/>
      <path class="skin-fill" d="M156 381 L156 405 C162 410 179 410 185 405 C181 401 176 391 172 381 Z" fill="var(--skin-color, #fcd7b6)"/>
      <path d="M157 326 Q162 329 168 326" fill="none" stroke="#c98c70" stroke-width="1.3" opacity="0.3"/>
    </g>

    <!-- Arms -->
    <!-- Left Arm -->
    <g id="pose-arm-left">
      <path class="skin-fill" d="M126 114 C113 140 103 171 98 205 C96 215 102 219 106 214 C111 180 119 150 130 125 Z" fill="var(--skin-color, #fcd7b6)"/>
      <circle class="skin-fill" cx="99" cy="215" r="7" fill="var(--skin-color, #fcd7b6)"/>
    </g>
    <!-- Right Arm -->
    <g id="pose-arm-right">
      <path class="skin-fill" d="M174 114 C187 140 197 171 202 205 C204 215 198 219 194 214 C189 180 181 150 170 125 Z" fill="var(--skin-color, #fcd7b6)"/>
      <circle class="skin-fill" cx="201" cy="215" r="7" fill="var(--skin-color, #fcd7b6)"/>
    </g>

    <!-- Rigged Head Channel -->
    <g id="pose-head">
      <!-- Head -->
      <ellipse class="skin-fill" cx="150" cy="62" rx="29" ry="35" fill="var(--skin-color, #fcd7b6)"/>
      
      <!-- Cute Ears -->
      <circle class="skin-fill" cx="120" cy="64" r="4.8" fill="var(--skin-color, #fcd7b6)"/>
      <circle class="skin-fill" cx="180" cy="64" r="4.8" fill="var(--skin-color, #fcd7b6)"/>

      <!-- Face Details -->
      <g id="baked-face">
        <!-- Soft Blush -->
        <ellipse cx="134" cy="68" rx="6" ry="3.5" fill="#f28482" opacity="0.5" stroke="none"/>
        <ellipse cx="166" cy="68" rx="6" ry="3.5" fill="#f28482" opacity="0.5" stroke="none"/>

        <!-- Big Cute Eyes -->
        <ellipse cx="136" cy="60" rx="3.5" ry="5" fill="#2d261e" stroke="none"/>
        <circle cx="135" cy="58" r="1.5" fill="#ffffff" stroke="none"/>
        <path d="M131 54 C134 52 139 52 142 54" fill="none" stroke="#2d261e" stroke-width="1.8"/>

        <ellipse cx="164" cy="60" rx="3.5" ry="5" fill="#2d261e" stroke="none"/>
        <circle cx="163" cy="58" r="1.5" fill="#ffffff" stroke="none"/>
        <path d="M158 54 C161 52 166 52 169 54" fill="none" stroke="#2d261e" stroke-width="1.8"/>

        <!-- Tiny Cute Nose & Smile -->
        <circle cx="150" cy="66" r="1" fill="#2d261e" stroke="none"/>
        <path id="doll-mouth-default" d="M146 73 C148 76 152 76 154 73" fill="none" stroke="#2d261e" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
  </g>
  </g>
</svg>
