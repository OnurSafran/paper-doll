<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" data-asset-id="doll_classic_a">
  <g id="body" class="outline-shape" stroke="#2d261e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Neck -->
    <rect class="skin-fill" x="141" y="90" width="18" height="24" rx="4" fill="var(--skin-color, #fcd7b6)"/>
    
    <!-- Torso -->
    <path class="skin-fill" d="M126 112 C120 135 120 160 122 195 C124 210 130 220 134 228 L166 228 C170 220 176 210 178 195 C180 160 180 135 174 112 Z" fill="var(--skin-color, #fcd7b6)"/>
    
    <!-- Cute Pastel Undergarments -->
    <path d="M125 125 C135 140 165 140 175 125 L173 155 C165 158 135 158 127 155 Z" fill="#ffe5ec" stroke="#2d261e" stroke-width="2"/>
    <path d="M123 200 C140 205 160 205 177 200 L174 225 C160 229 140 229 126 225 Z" fill="#ffe5ec" stroke="#2d261e" stroke-width="2"/>
    
    <!-- Legs & Feet -->
    <!-- Left Leg -->
    <path class="skin-fill" d="M132 225 C130 270 128 320 130 375 L144 375 C145 320 148 270 147 225 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Leg -->
    <path class="skin-fill" d="M153 225 C152 270 155 320 156 375 L170 375 C172 320 170 270 168 225 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Left Foot -->
    <path class="skin-fill" d="M128 375 C125 385 120 395 116 398 C122 402 138 402 144 398 L144 375 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Foot -->
    <path class="skin-fill" d="M156 375 L156 398 C162 402 178 402 184 398 C180 395 175 385 172 375 Z" fill="var(--skin-color, #fcd7b6)"/>

    <!-- Arms -->
    <!-- Left Arm -->
    <path class="skin-fill" d="M126 114 C112 140 102 170 98 205 C96 215 102 218 106 214 C110 180 118 150 130 125 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Arm -->
    <path class="skin-fill" d="M174 114 C188 140 198 170 202 205 C204 215 198 218 194 214 C190 180 182 150 170 125 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Left Hand -->
    <circle class="skin-fill" cx="99" cy="214" r="7" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Hand -->
    <circle class="skin-fill" cx="201" cy="214" r="7" fill="var(--skin-color, #fcd7b6)"/>

    <!-- Head -->
    <ellipse class="skin-fill" cx="150" cy="62" rx="30" ry="36" fill="var(--skin-color, #fcd7b6)"/>
    
    <!-- Cute Ears -->
    <circle class="skin-fill" cx="119" cy="64" r="5" fill="var(--skin-color, #fcd7b6)"/>
    <circle class="skin-fill" cx="181" cy="64" r="5" fill="var(--skin-color, #fcd7b6)"/>

    <!-- Face Details -->
    <g id="baked-face">
      <!-- Soft Blush -->
      <ellipse cx="134" cy="68" rx="6" ry="3.5" fill="#f28482" opacity="0.5" stroke="none"/>
      <ellipse cx="166" cy="68" rx="6" ry="3.5" fill="#f28482" opacity="0.5" stroke="none"/>

      <!-- Big Cute Eyes -->
      <ellipse cx="136" cy="60" rx="3.5" ry="5" fill="#2d261e" stroke="none"/>
      <circle cx="135" cy="58" r="1.5" fill="#ffffff" stroke="none"/>
      <path d="M131 54 C134 52 139 52 142 54" fill="none" stroke="#2d261e" stroke-width="1.8"/>

      <ellipse cx="164" cy="60" rx="3.5" ry="5" fill="#2d261e" stroke="none"/>
      <circle cx="163" cy="58" r="1.5" fill="#ffffff" stroke="none"/>
      <path d="M158 54 C161 52 166 52 169 54" fill="none" stroke="#2d261e" stroke-width="1.8"/>

      <!-- Tiny Cute Nose & Smile -->
      <circle cx="150" cy="66" r="1" fill="#2d261e" stroke="none"/>
      <path id="doll-mouth-default" d="M146 73 C148 76 152 76 154 73" fill="none" stroke="#2d261e" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
