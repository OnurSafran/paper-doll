<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" data-asset-id="doll_elder_a">
  <g id="body" class="outline-shape" stroke="#2d261e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Elder Neck -->
    <rect class="skin-fill" x="140" y="90" width="20" height="25" rx="5" fill="var(--skin-color, #fcd7b6)"/>
    
    <!-- Elder Torso (Gentle, softer slope) -->
    <path class="skin-fill" d="M124 110 C118 135 119 165 121 198 C123 214 129 226 135 234 L165 234 C171 226 177 214 179 198 C181 165 182 135 176 110 C164 116 136 118 124 110 Z" fill="var(--skin-color, #fcd7b6)"/>
    
    <!-- Undergarments -->
    <path d="M125 124 C135 138 165 138 175 124 L173 156 C165 159 135 159 127 156 Z" fill="#e8f4f0" stroke="#2d261e" stroke-width="2"/>
    <path d="M121 205 C140 211 160 211 179 205 L174 232 C160 236 140 236 126 232 Z" fill="#e8f4f0" stroke="#2d261e" stroke-width="2"/>
    
    <!-- Legs & Feet -->
    <!-- Left Leg -->
    <path class="skin-fill" d="M131 234 C129 277 127 326 129 382 L144 382 C145 327 148 277 147 234 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Leg -->
    <path class="skin-fill" d="M153 234 C152 277 155 327 156 382 L171 382 C173 326 171 277 169 234 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Left Foot -->
    <path class="skin-fill" d="M127 382 C124 393 119 403 114 406 C121 411 138 411 144 406 L144 382 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Foot -->
    <path class="skin-fill" d="M156 382 L156 406 C162 411 179 411 186 406 C182 402 176 392 173 382 Z" fill="var(--skin-color, #fcd7b6)"/>

    <!-- Arms (Gentle posture) -->
    <!-- Left Arm -->
    <path class="skin-fill" d="M124 112 C111 137 101 167 97 203 C95 214 101 219 106 214 C111 180 119 150 130 124 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Arm -->
    <path class="skin-fill" d="M176 112 C189 137 199 167 203 203 C205 214 199 219 194 214 C189 180 181 150 170 124 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Left Hand -->
    <circle class="skin-fill" cx="98" cy="215" r="7.2" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Hand -->
    <circle class="skin-fill" cx="202" cy="215" r="7.2" fill="var(--skin-color, #fcd7b6)"/>

    <!-- Soft knee and knuckle contours -->
    <path d="M131 329 Q137 332 143 329 M157 329 Q163 332 169 329" fill="none" stroke="#c98c70" stroke-width="1.3" opacity="0.3"/>
    <path d="M94 207 Q98 209 102 207 M198 207 Q202 209 206 207" fill="none" stroke="#c98c70" stroke-width="1.2" opacity="0.35"/>

    <!-- Head -->
    <ellipse class="skin-fill" cx="150" cy="63" rx="30" ry="35" fill="var(--skin-color, #fcd7b6)"/>
    
    <!-- Ears -->
    <circle class="skin-fill" cx="119" cy="65" r="5" fill="var(--skin-color, #fcd7b6)"/>
    <circle class="skin-fill" cx="181" cy="65" r="5" fill="var(--skin-color, #fcd7b6)"/>

    <!-- Face Details -->
    <g id="baked-face">
      <!-- Gentle Smile Lines -->
      <path d="M132 67 C130 69 130 72 132 74" fill="none" stroke="#2d261e" stroke-width="1.2" opacity="0.4"/>
      <path d="M168 67 C170 69 170 72 168 74" fill="none" stroke="#2d261e" stroke-width="1.2" opacity="0.4"/>
      
      <!-- Gentle Kind Eyes -->
      <ellipse cx="136" cy="60" rx="3.5" ry="4.8" fill="#2d261e" stroke="none"/>
      <circle cx="135" cy="58.5" r="1.4" fill="#ffffff" stroke="none"/>
      <path d="M131 53 C134 51 139 51 142 53" fill="none" stroke="#2d261e" stroke-width="1.8"/>
      
      <ellipse cx="164" cy="60" rx="3.5" ry="4.8" fill="#2d261e" stroke="none"/>
      <circle cx="163" cy="58.5" r="1.4" fill="#ffffff" stroke="none"/>
      <path d="M158 53 C161 51 166 51 169 53" fill="none" stroke="#2d261e" stroke-width="1.8"/>

      <!-- Nose & Gentle Warm Smile -->
      <circle cx="150" cy="66" r="1" fill="#2d261e" stroke="none"/>
      <path id="doll-mouth-default" d="M146 73 C148 76 152 76 154 73" fill="none" stroke="#2d261e" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
