    <!-- Left Arm -->
    <path class="skin-fill" d="M123 110 C110 138 100 170 96 208 C94 218 100 221 104 217 C108 182 116 150 127 122 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Arm -->
    <path class="skin-fill" d="M177 110 C190 138 200 170 204 208 C206 218 200 221 196 217 C192 182 184 150 173 122 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Left Hand -->
    <circle class="skin-fill" cx="97" cy="218" r="7" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Hand -->
    <circle class="skin-fill" cx="203" cy="218" r="7" fill="var(--skin-color, #fcd7b6)"/>

    <!-- Head -->
    <ellipse class="skin-fill" cx="150" cy="62" rx="29" ry="35" fill="var(--skin-color, #fcd7b6)"/>
    
    <!-- Ears -->
    <circle class="skin-fill" cx="120" cy="64" r="5" fill="var(--skin-color, #fcd7b6)"/>
    <circle class="skin-fill" cx="180" cy="64" r="5" fill="var(--skin-color, #fcd7b6)"/>

    <!-- Face Details -->
    <g id="baked-face">
      <!-- Soft Blush -->
      <ellipse cx="134" cy="68" rx="5" ry="3" fill="#f28482" opacity="0.4" stroke="none"/>
      <ellipse cx="166" cy="68" rx="5" ry="3" fill="#f28482" opacity="0.4" stroke="none"/>
      
      <!-- Classic Eyes -->
      <ellipse cx="136" cy="60" rx="3.5" ry="5" fill="#2d261e" stroke="none"/>
      <circle cx="135" cy="58" r="1.5" fill="#ffffff" stroke="none"/>
      <path d="M131 53 C134 51 139 51 142 53" fill="none" stroke="#2d261e" stroke-width="1.8"/>
      
      <ellipse cx="164" cy="60" rx="3.5" ry="5" fill="#2d261e" stroke="none"/>
      <circle cx="163" cy="58" r="1.5" fill="#ffffff" stroke="none"/>
      <path d="M158 53 C161 51 166 51 169 53" fill="none" stroke="#2d261e" stroke-width="1.8"/>

