<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" data-asset-id="doll_adult_a">
  <g id="body" class="outline-shape" stroke="#2d261e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Adult Neck -->
    <rect class="skin-fill" x="141" y="88" width="18" height="24" rx="4" fill="var(--skin-color, #fcd7b6)"/>
    
    <!-- Adult Torso (Slightly taller silhouette) -->
    <path class="skin-fill" d="M121 108 C116 135 117 166 120 201 C122 218 128 229 133 236 L167 236 C172 229 178 218 180 201 C183 166 184 135 179 108 C164 116 136 116 121 108 Z" fill="var(--skin-color, #fcd7b6)"/>
    
    <!-- Undergarments -->
    <path d="M123 122 C135 136 165 136 177 122 L175 154 C165 157 135 157 125 154 Z" fill="#e8edff" stroke="#2d261e" stroke-width="2"/>
    <path d="M120 207 C140 213 160 213 180 207 L175 235 C160 239 140 239 125 235 Z" fill="#e8edff" stroke="#2d261e" stroke-width="2"/>
    
    <!-- Long Legs & Feet -->
    <!-- Left Leg -->
    <path class="skin-fill" d="M131 236 C128 282 126 334 128 389 L143 389 C144 335 147 282 146 236 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Leg -->
    <path class="skin-fill" d="M154 236 C153 282 156 335 157 389 L172 389 C174 334 172 282 169 236 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Left Foot -->
    <path class="skin-fill" d="M126 389 C123 399 118 408 113 411 C120 414 138 414 144 411 L143 389 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Foot -->
    <path class="skin-fill" d="M157 389 L157 411 C163 414 181 414 187 411 C183 408 177 399 173 389 Z" fill="var(--skin-color, #fcd7b6)"/>

    <!-- Arms -->
    <!-- Left Arm -->
    <path class="skin-fill" d="M121 110 C108 138 98 171 94 209 C92 219 98 223 103 218 C108 182 116 150 128 122 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Arm -->
    <path class="skin-fill" d="M179 110 C192 138 202 171 206 209 C208 219 202 223 197 218 C192 182 184 150 172 122 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Left Hand -->
    <circle class="skin-fill" cx="96" cy="219" r="7.5" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Hand -->
    <circle class="skin-fill" cx="204" cy="219" r="7.5" fill="var(--skin-color, #fcd7b6)"/>

    <!-- Subtle knee and ankle contours -->
    <path d="M130 337 Q136 340 142 337 M158 337 Q164 340 170 337" fill="none" stroke="#c98c70" stroke-width="1.3" opacity="0.28"/>
    <path d="M128 389 Q135 392 143 389 M157 389 Q165 392 172 389" fill="none" stroke="#c98c70" stroke-width="1.2" opacity="0.24"/>

    <!-- Head -->
    <ellipse class="skin-fill" cx="150" cy="61" rx="28" ry="34" fill="var(--skin-color, #fcd7b6)"/>
    
    <!-- Ears -->
    <circle class="skin-fill" cx="121" cy="63" r="4.8" fill="var(--skin-color, #fcd7b6)"/>
    <circle class="skin-fill" cx="179" cy="63" r="4.8" fill="var(--skin-color, #fcd7b6)"/>

    <!-- Face Details -->
    <g id="baked-face">
      <!-- Soft Blush -->
      <ellipse cx="134" cy="68" rx="5" ry="3" fill="#f28482" opacity="0.4" stroke="none"/>
      <ellipse cx="166" cy="68" rx="5" ry="3" fill="#f28482" opacity="0.4" stroke="none"/>
      
      <!-- Classic Eyes -->
      <ellipse cx="136" cy="60" rx="3.5" ry="5" fill="#2d261e" stroke="none"/>
      <circle cx="135" cy="58" r="1.5" fill="#ffffff" stroke="none"/>
      <path d="M131 53 C134 51 139 51 142 53" fill="none" stroke="#2d261e" stroke-width="1.8"/>
      
      <ellipse cx="164" cy="60" rx="3.5" ry="5" fill="#2d261e" stroke="none"/>
      <circle cx="163" cy="58" r="1.5" fill="#ffffff" stroke="none"/>
      <path d="M158 53 C161 51 166 51 169 53" fill="none" stroke="#2d261e" stroke-width="1.8"/>

      <!-- Nose & Smile -->
      <circle cx="150" cy="66" r="1" fill="#2d261e" stroke="none"/>
      <path id="doll-mouth-default" d="M146 73 C148 76 152 76 154 73" fill="none" stroke="#2d261e" stroke-width="2" stroke-linecap="round"/>
