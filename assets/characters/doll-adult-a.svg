    <path d="M121 206 C140 211 160 211 179 206 L175 232 C160 236 140 236 125 232 Z" fill="#e8edff" stroke="#2d261e" stroke-width="2"/>
    
    <!-- Long Legs & Feet -->
    <!-- Left Leg -->
    <path class="skin-fill" d="M131 232 C129 280 127 330 129 385 L143 385 C144 330 147 280 146 232 Z" fill="var(--skin-color, #fcd7b6)"/>
    <!-- Right Leg -->
    <path class="skin-fill" d="M154 232 C153 280 156 330 157 385 L171 385 C173 330 171 280 169 232 Z" fill="var(--skin-color, #fcd7b6)"/>
