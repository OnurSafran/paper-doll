<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" data-asset-id="bottom_overalls">
  <g id="garment" stroke="#2d261e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Dungaree Shoulder Straps -->
    <line class="tint-primary" x1="134" y1="112" x2="134" y2="150" stroke="var(--asset-color-primary, #73513d)" stroke-width="8"/>
    <line class="tint-primary" x1="166" y1="112" x2="166" y2="150" stroke="var(--asset-color-primary, #73513d)" stroke-width="8"/>
    <!-- Buckles -->
    <rect x="130" y="146" width="8" height="8" rx="2" fill="#ffd166" stroke="#2d261e" stroke-width="1.8"/>
    <rect x="162" y="146" width="8" height="8" rx="2" fill="#ffd166" stroke="#2d261e" stroke-width="1.8"/>

    <!-- Dungaree Bib -->
    <polygon class="tint-primary" points="132,150 168,150 174,185 126,185" fill="var(--asset-color-primary, #73513d)"/>
    <!-- Bib Pocket -->
    <rect x="140" y="158" width="20" height="16" rx="2" fill="#ffffff" opacity="0.3" stroke="#2d261e" stroke-width="1.8"/>

    <!-- Pants Lower Section -->
    <path class="tint-primary" d="M124 185 L176 185 L180 340 L156 340 L150 240 L144 340 L120 340 Z" fill="var(--asset-color-primary, #73513d)"/>

    <!-- Seam Details -->
    <line x1="150" y1="185" x2="150" y2="240" stroke="#2d261e" stroke-width="2"/>
    <circle cx="127" cy="188" r="2" fill="#ffd166" stroke="#2d261e" stroke-width="1"/>
    <circle cx="173" cy="188" r="2" fill="#ffd166" stroke="#2d261e" stroke-width="1"/>

    <!-- Rolled Ankle Cuffs -->
    <rect x="119" y="332" width="26" height="10" rx="2" fill="#ffffff" opacity="0.3" stroke="#2d261e" stroke-width="2"/>
    <rect x="155" y="332" width="26" height="10" rx="2" fill="#ffffff" opacity="0.3" stroke="#2d261e" stroke-width="2"/>
  </g>
</svg>
