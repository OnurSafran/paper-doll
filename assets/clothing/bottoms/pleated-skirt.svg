<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" data-asset-id="bottom_pleated_skirt">
  <g id="garment" stroke="#2d261e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Waistband -->
    <rect class="tint-primary" x="124" y="180" width="52" height="10" fill="var(--asset-color-primary, #c94c5c)"/>
    
    <!-- Flared Pleated Skirt Body -->
    <path class="tint-primary" d="M124 190 L176 190 L195 260 L105 260 Z" fill="var(--asset-color-primary, #c94c5c)"/>

    <!-- Sharp Pleat Lines & Shadows -->
