      <line x1="130" y1="190" x2="116" y2="260"/>
      <line x1="138" y1="190" x2="130" y2="260"/>
      <line x1="146" y1="190" x2="144" y2="260"/>
      <line x1="154" y1="190" x2="156" y2="260"/>
      <line x1="162" y1="190" x2="170" y2="260"/>
      <line x1="170" y1="190" x2="184" y2="260"/>
    </g>

    <!-- Plaid Grid Accent Stripe -->
    <path d="M110 240 Q150 244 190 240" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M107 252 Q150 256 193 252" fill="none" stroke="#ffd166" stroke-width="2"/>
  </g>
</svg>
