<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" data-asset-id="top_cardigan">
  <g id="garment" stroke="#2d261e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Inner White Shirt Base -->
    <path d="M136 108 L164 108 L164 185 L136 185 Z" fill="#ffffff"/>
    <path d="M142 110 L150 125 L158 110" fill="none" stroke="#2d261e" stroke-width="2"/>
    
    <!-- Sleeves -->
    <!-- Left Sleeve -->
    <path class="tint-primary" d="M126 112 L102 165 L116 170 L132 124 Z" fill="var(--asset-color-primary, #a78bc4)"/>
    <!-- Right Sleeve -->
    <path class="tint-primary" d="M174 112 L198 165 L184 170 L168 124 Z" fill="var(--asset-color-primary, #a78bc4)"/>
    
    <!-- Sleeve Cuffs -->
    <rect x="100" y="162" width="16" height="8" rx="2" fill="#fdf0ed" stroke="#2d261e" stroke-width="2"/>
    <rect x="184" y="162" width="16" height="8" rx="2" fill="#fdf0ed" stroke="#2d261e" stroke-width="2"/>

    <!-- Main Cardigan Body -->
    <!-- Left Panel -->
    <path class="tint-primary" d="M126 112 L146 145 L146 188 L122 185 Z" fill="var(--asset-color-primary, #a78bc4)"/>
    <!-- Right Panel -->
    <path class="tint-primary" d="M174 112 L154 145 L154 188 L178 185 Z" fill="var(--asset-color-primary, #a78bc4)"/>
    
    <!-- V-neck Trim -->
    <path d="M126 112 L150 148 L174 112" fill="none" stroke="#2d261e" stroke-width="2.5"/>
    <line x1="150" y1="148" x2="150" y2="188" stroke="#2d261e" stroke-width="2.5"/>
    
    <!-- Cute Buttons -->
    <circle cx="150" cy="155" r="2.5" fill="#ffd166" stroke="#2d261e" stroke-width="1.5"/>
    <circle cx="150" cy="168" r="2.5" fill="#ffd166" stroke="#2d261e" stroke-width="1.5"/>
    <circle cx="150" cy="180" r="2.5" fill="#ffd166" stroke="#2d261e" stroke-width="1.5"/>

    <!-- Pockets -->
    <rect x="127" y="165" width="14" height="12" rx="2" fill="#ffffff" opacity="0.3" stroke="#2d261e" stroke-width="1.5"/>
    <rect x="159" y="165" width="14" height="12" rx="2" fill="#ffffff" opacity="0.3" stroke="#2d261e" stroke-width="1.5"/>
  </g>
</svg>
