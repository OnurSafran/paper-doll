<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" data-asset-id="prop_easel">
  <g id="prop" stroke="#2d261e" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <!-- Back Leg of Easel -->
    <line x1="500" y1="180" x2="500" y2="940" stroke="#8b5e34" stroke-width="28"/>

    <!-- Left & Right Front Legs -->
    <line x1="500" y1="120" x2="220" y2="950" stroke="#a06d3b" stroke-width="30"/>
    <line x1="500" y1="120" x2="780" y2="950" stroke="#a06d3b" stroke-width="30"/>

    <!-- Horizontal Canvas Shelf Bar -->
    <rect x="200" y="600" width="600" height="40" rx="10" fill="#a06d3b" stroke="#2d261e" stroke-width="16"/>

    <!-- Canvas on Easel -->
    <rect x="260" y="240" width="480" height="380" rx="14" fill="#fffdf7" stroke="#2d261e" stroke-width="16"/>

    <!-- Painted Artwork on Canvas: Landscape & Rainbow -->
    <rect x="280" y="260" width="440" height="340" rx="8" fill="#e0f2fe" stroke="none"/>
    <circle cx="630" cy="330" r="35" fill="#ffd166" stroke="none"/>
    <path d="M280 500 Q400 420 520 480 T720 450 L720 600 L280 600 Z" fill="#86a873" stroke="none"/>
    <path d="M280 540 Q450 480 720 520 L720 600 L280 600 Z" fill="#588157" stroke="none"/>
    <path d="M320 440 Q450 320 580 440" fill="none" stroke="#ef476f" stroke-width="12"/>
    <path d="M330 448 Q450 338 570 448" fill="none" stroke="#ffd166" stroke-width="12"/>
    <path d="M340 456 Q450 356 560 456" fill="none" stroke="#4ea8de" stroke-width="12"/>

    <!-- Top Canvas Clamp Knob -->
    <rect x="450" y="200" width="100" height="45" rx="8" fill="#a06d3b" stroke="#2d261e" stroke-width="16"/>
  </g>
</svg>
