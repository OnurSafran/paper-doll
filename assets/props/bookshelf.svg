<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" data-asset-id="prop_bookshelf">
  <g id="prop" stroke="#2d261e" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <!-- Bookshelf Wooden Frame -->
    <rect x="180" y="120" width="640" height="820" rx="16" fill="#8b5e34" stroke="#2d261e" stroke-width="20"/>

    <!-- Inner Cavities / Shelves -->
    <rect x="220" y="160" width="560" height="220" rx="8" fill="#6f4e37" stroke="none"/>
    <rect x="220" y="420" width="560" height="220" rx="8" fill="#6f4e37" stroke="none"/>
    <rect x="220" y="680" width="560" height="220" rx="8" fill="#6f4e37" stroke="none"/>

    <!-- Shelf Horizontal Dividers -->
    <line x1="180" y1="400" x2="820" y2="400" stroke="#2d261e" stroke-width="20"/>
    <line x1="180" y1="660" x2="820" y2="660" stroke="#2d261e" stroke-width="20"/>

    <!-- Top Shelf: Books & Cute Potted Plant -->
    <rect x="240" y="200" width="45" height="180" rx="6" fill="#ef476f"/>
    <rect x="290" y="180" width="55" height="200" rx="6" fill="#ffd166"/>
    <rect x="350" y="220" width="40" height="160" rx="6" fill="#06d6a0"/>
    <polygon points="400,380 435,230 480,240 445,380" fill="#118ab2"/>
    <!-- Plant in Pot -->
    <g transform="translate(630, 240)">
      <polygon points="10,90 20,140 70,140 80,90" fill="#e07a5f"/>
      <circle cx="30" cy="65" r="28" fill="#81b29a"/>
      <circle cx="60" cy="55" r="26" fill="#81b29a"/>
      <circle cx="45" cy="35" r="24" fill="#a7c957"/>
    </g>

    <!-- Middle Shelf: Thick Encyclopedias & Crystal Globe -->
    <rect x="240" y="460" width="60" height="180" rx="6" fill="#a78bc4"/>
    <rect x="305" y="440" width="55" height="200" rx="6" fill="#4ea8de"/>
    <rect x="365" y="470" width="50" height="170" rx="6" fill="#f4a261"/>
    <rect x="420" y="450" width="65" height="190" rx="6" fill="#2a9d8f"/>
    <rect x="650" y="460" width="50" height="180" rx="6" fill="#e76f51"/>
    <rect x="705" y="450" width="55" height="190" rx="6" fill="#ffd166"/>

    <!-- Bottom Shelf: Book Stacks -->
    <!-- Flat Stack -->
    <rect x="250" y="810" width="160" height="40" rx="6" fill="#457b9d"/>
    <rect x="260" y="765" width="140" height="40" rx="6" fill="#e76f51"/>
    <rect x="270" y="720" width="120" height="40" rx="6" fill="#2a9d8f"/>
    <!-- Upright Books -->
    <rect x="470" y="710" width="45" height="170" rx="6" fill="#ffd166"/>
    <rect x="520" y="700" width="55" height="180" rx="6" fill="#b56576"/>
    <rect x="580" y="720" width="40" height="160" rx="6" fill="#8338ec"/>
    <rect x="625" y="695" width="60" height="185" rx="6" fill="#06d6a0"/>
    <rect x="690" y="715" width="45" height="165" rx="6" fill="#f4a261"/>
  </g>
</svg>
