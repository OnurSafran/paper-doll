<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" data-asset-id="prop_umbrella">
  <g id="prop" stroke="#2d261e" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <!-- Umbrella Pole -->
    <line x1="500" y1="200" x2="500" y2="920" stroke="#f4a261" stroke-width="26"/>
    <!-- Ground Sand Stand Base -->
    <polygon points="380,940 500,880 620,940" fill="#e9c46a"/>
    <ellipse cx="500" cy="940" rx="150" ry="30" fill="#d4a373"/>

    <!-- Top Spire Finial -->
    <polygon points="500,80 485,150 515,150" fill="#ffd166"/>

    <!-- Umbrella Canopy (Striped Scalloped Dome) -->
    <!-- Outer Canopy Arc -->
    <path d="M120 440 C160 140 840 140 880 440 L880 460 Q800 490 720 450 Q640 490 560 450 Q480 490 400 450 Q320 490 240 450 Q160 490 120 450 Z" fill="#4ea8de"/>

    <!-- Striped Segments -->
    <!-- Yellow Segment 1 -->
    <path d="M500 140 Q320 180 240 450 Q320 490 400 450 Q430 250 500 140 Z" fill="#ffd166"/>
    <!-- Coral Segment 2 -->
    <path d="M500 140 Q450 250 400 450 Q480 490 560 450 Q530 250 500 140 Z" fill="#ef476f"/>
    <!-- White Segment 3 -->
    <path d="M500 140 Q530 250 560 450 Q640 490 720 450 Q660 250 500 140 Z" fill="#fffdf7"/>

    <!-- Rib Lines -->
    <path d="M500 140 Q350 220 240 450" fill="none" stroke="#2d261e" stroke-width="16"/>
    <path d="M500 140 Q430 250 400 450" fill="none" stroke="#2d261e" stroke-width="16"/>
    <path d="M500 140 Q530 250 560 450" fill="none" stroke="#2d261e" stroke-width="16"/>
    <path d="M500 140 Q630 250 720 450" fill="none" stroke="#2d261e" stroke-width="16"/>
    
    <!-- Fringe / Valance Edge -->
    <path d="M120 450 Q180 490 240 450 Q320 490 400 450 Q480 490 560 450 Q640 490 720 450 Q800 490 880 450" fill="none" stroke="#2d261e" stroke-width="16"/>
  </g>
</svg>
